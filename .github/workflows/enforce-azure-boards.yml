name: Enforce Azure Boards Linking

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-azure-boards-reference:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      - name: Check PR title for Azure Boards reference
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "Checking PR title: $PR_TITLE"

          # Use grep to match AB#{number} anywhere in the string (e.g., "AB#123: Title")
          if echo "$PR_TITLE" | grep -qE 'AB#[0-9]+'; then
            echo "✓ PR title contains Azure Boards reference"
            exit 0
          fi

          echo "::error::PR title must contain Azure Boards reference (e.g., AB#123 or AB#123: Title)"
          exit 1